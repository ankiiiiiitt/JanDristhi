version: "3.9"

services:
  # ─── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: jandrishti-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jandrishti_dev
    volumes:
      - mongo_data:/data/db
    networks:
      - jandrishti-net

  # ─── Backend (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jandrishti-backend
    restart: unless-stopped
    ports:
      - "8199:8199"
    environment:
      ENVIRONMENT: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: jandrishti_dev
      UPLOAD_STORAGE_DIR: /app/backend/uploads
      BACKEND_PORT: 8199
      BACKEND_HOST: "0.0.0.0"
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5199","http://frontend"]'
      LOG_LEVEL: info
      MOCK_MODE: "false"
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      - mongodb
    networks:
      - jandrishti-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8199/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (React + nginx) ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: jandrishti-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jandrishti-net

volumes:
  mongo_data:
  uploads_data:

networks:
  jandrishti-net:
    driver: bridge
